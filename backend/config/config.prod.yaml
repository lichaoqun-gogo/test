# 生产环境配置 (APP_ENV=prod)
# 注意：部署时替换为实际值，切勿将敏感信息提交到版本库
server:
  port: 8080
  mode: release

database:
  host: PROD_DB_HOST
  port: 3306
  user: PROD_DB_USER
  password: PROD_DB_PASSWORD
  dbname: osm
  charset: utf8mb4
  parseTime: true
  loc: Local
  maxIdleConns: 20
  maxOpenConns: 200

# MinIO 对象存储配置
minio:
  endpoint: PROD_MINIO_ENDPOINT
  accessKeyId: PROD_MINIO_ACCESS_KEY
  secretAccessKey: PROD_MINIO_SECRET_KEY
  useSSL: true
  bucketName: osm

log:
  level: info
  format: json
  filePath: logs/osm.log

# 认证配置（生产环境：CAS 单点登录）
auth:
  mode: cas
  cas:
    # 【必填】公司 CAS 服务器地址，上线时替换这一处即可
    serverURL: https://cas.company.com
    # 以下均为可选项，未配置时自动推导：
    # serviceURL:  未配置时从请求 Host 自动推导为 {scheme}://{host}/api/v1/auth/cas/callback
    # validateURL: 未配置时自动推导为 {serverURL}/serviceValidate（CAS 2.0 标准路径）
    # frontendURL: 未配置时用相对路径重定向（前后端同域/Nginx 反代时自动生效）
  jwt:
    secret: PROD_JWT_SECRET_REPLACE_ME
    expiry: 86400
