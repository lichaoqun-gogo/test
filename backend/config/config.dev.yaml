# 开发环境配置 (APP_ENV=dev)
server:
  port: 8080
  mode: debug

database:
  host: 127.0.0.1
  port: 3306
  user: root
  password: ""
  dbname: osm
  charset: utf8mb4
  parseTime: true
  loc: Local
  maxIdleConns: 10
  maxOpenConns: 100

# MinIO 对象存储配置
minio:
  endpoint: 127.0.0.1:9000
  accessKeyId: minioadmin
  secretAccessKey: minioadmin
  useSSL: false
  bucketName: osm

log:
  level: debug
  format: json
  filePath: logs/osm.log

# 认证配置（开发环境：CAS 单点登录，对接本地 mock CAS 服务）
auth:
  mode: cas
  cas:
    serverURL: http://localhost:8443
    # 开发环境前后端不同域（未走 Nginx），需显式配置以下两项：
    serviceURL: http://localhost:8080/api/v1/auth/cas/callback
    frontendURL: http://localhost:3000
    # validateURL 未配置时自动推导为 {serverURL}/serviceValidate
    # jwt 未配置时使用内置默认值
