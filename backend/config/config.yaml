# 当前环境：指定后程序自动加载 config.{env}.yaml
# 可选值：dev / prod / prod-bj 等，按需扩展
env: dev

server:
  port: 8080
  mode: debug  # debug/release

database:
  host: 127.0.0.1
  port: 3306
  user: root
  password: ""
  dbname: osm
  charset: utf8mb4
  parseTime: true
  loc: Local
  maxIdleConns: 10
  maxOpenConns: 100

# MinIO 对象存储配置
# 注意：上线前需要修改以下配置为实际的MinIO服务地址
minio:
  endpoint: 127.0.0.1:9000  # 上线后修改为实际MinIO服务地址，如：minio.example.com:9000
  accessKeyId: minioadmin   # 上线后修改为实际AccessKey
  secretAccessKey: minioadmin  # 上线后修改为实际SecretKey
  useSSL: false             # 生产环境建议开启SSL
  bucketName: osm           # 源码备份桶名称，固定为 osm

log:
  level: debug
  format: json
  filePath: logs/osm.log

# 认证配置
auth:
  # 认证模式：local=本地mock账号（开发），cas=CAS单点登录（生产）
  mode: local
  cas:
    serverURL: http://localhost:8443
    serviceURL: http://localhost:8080/api/v1/auth/cas/callback
    validateURL: http://localhost:8443/serviceValidate
    frontendURL: http://localhost:3000
  jwt:
    secret: osm-jwt-secret-key-change-in-production
    expiry: 86400
